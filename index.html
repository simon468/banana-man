<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123a37"><title>Banana Man · Peel the heat</title><link rel="stylesheet" href="style.css"></head>
